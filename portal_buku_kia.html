<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kelas Belajar Ibu dan Anak (Buku KIA 2024)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        kia: {
                            pink: '#fdf2f8', // pastel pink bg
                            pinkdark: '#fbcfe8', // pastel pink highlight
                            blue: '#e0f2fe', // pastel blue
                            bluedark: '#bae6fd', // pastel blue highlight
                            text: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fdf2f8; 
        }
        ::-webkit-scrollbar-thumb {
            background: #fbcfe8; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f9a8d4; 
        }

        /* Iframe transition */
        #content-frame {
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
        }
        #content-frame.loading {
            opacity: 0;
        }

        /* Active button state styles */
        .nav-btn.active {
            background: linear-gradient(to right, #fbcfe8, #e0f2fe);
            border-left-width: 4px;
            border-left-color: #ec4899;
            transform: scale(1.02);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .nav-btn.active .icon-container {
            background-color: #fff;
            color: #ec4899;
        }
    </style>
</head>
<body class="bg-kia-pink text-kia-text font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <!-- Heart/Baby Icon -->
                    <div class="bg-gradient-to-br from-pink-300 to-blue-300 p-2 rounded-xl text-white shadow-inner">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                        </svg>
                    </div>
                    <h1 class="font-bold text-xl sm:text-2xl text-slate-800 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-blue-500">
                        Portal Kelas Belajar Ibu & Anak
                    </h1>
                </div>
                <div class="hidden sm:block text-sm font-semibold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">
                    Buku KIA 2024
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Navigation Sidebar -->
        <nav class="md:w-72 bg-white flex-shrink-0 shadow-lg md:shadow-none border-b md:border-b-0 md:border-r border-pink-100 z-10 flex flex-col">
            <div class="p-4 bg-gradient-to-b from-white to-pink-50 flex-1 overflow-y-auto overflow-x-auto md:overflow-x-hidden whitespace-nowrap md:whitespace-normal flex md:block gap-3 md:gap-0 snap-x">
                
                <div class="md:mb-4 hidden md:block">
                    <p class="text-xs font-bold text-pink-400 uppercase tracking-wider pl-2">Modul Pembelajaran</p>
                </div>

                <!-- Button 1: Buku KIA (Default) -->
                <button onclick="loadModule('buku-kia', 'https://tirtadsusanto-ops.github.io/AplikasiKelasBelajarIsiDanCaraPenggunaanBukuKIA2024/')" 
                        id="btn-buku-kia"
                        class="nav-btn snap-center flex-shrink-0 w-64 md:w-full flex items-center p-3 mb-0 md:mb-3 rounded-xl md:rounded-l-none md:rounded-r-xl transition-all duration-200 border-l-4 border-transparent hover:bg-kia-pinkdark text-left group active">
                    <div class="icon-container w-10 h-10 rounded-full bg-pink-100 text-pink-500 flex items-center justify-center mr-3 transition-colors duration-200 group-hover:bg-white group-hover:text-pink-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-slate-700 text-sm">Buku KIA 2024</div>
                        <div class="text-xs text-slate-500 hidden md:block mt-0.5">Isi dan Cara Penggunaan</div>
                    </div>
                </button>

                <!-- Button 2: Pemenuhan Gizi -->
                <button onclick="loadModule('gizi', 'https://tirtadsusanto-ops.github.io/AplikasiKelasBelajarPemenuhanGiziUsia6sampai24BulanBukuKIA2024/')" 
                        id="btn-gizi"
                        class="nav-btn snap-center flex-shrink-0 w-64 md:w-full flex items-center p-3 mb-0 md:mb-3 rounded-xl md:rounded-l-none md:rounded-r-xl transition-all duration-200 border-l-4 border-transparent hover:bg-kia-pinkdark text-left group">
                    <div class="icon-container w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center mr-3 transition-colors duration-200 group-hover:bg-white group-hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 15.546c-.523 0-1.046.151-1.5.454a2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.704 2.704 0 00-3 0 2.704 2.704 0 01-3 0 2.701 2.701 0 00-1.5-.454M9 6v2m3-2v2m3-2v2M9 3h.01M12 3h.01M15 3h.01M21 21v-7a2 2 0 00-2-2H5a2 2 0 00-2 2v7h18zm-3-9v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2h12z" />
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-slate-700 text-sm">Pemenuhan Gizi</div>
                        <div class="text-xs text-slate-500 hidden md:block mt-0.5">Usia 6 - 24 Bulan</div>
                    </div>
                </button>

                <!-- Button 3: Inisiasi Menyusu Dini -->
                <button onclick="loadModule('imd', 'https://tirtadsusanto-ops.github.io/AplikasiKelasBelajarInisiasiMenyusuDiniKIA2024/')" 
                        id="btn-imd"
                        class="nav-btn snap-center flex-shrink-0 w-64 md:w-full flex items-center p-3 mb-0 md:mb-3 rounded-xl md:rounded-l-none md:rounded-r-xl transition-all duration-200 border-l-4 border-transparent hover:bg-kia-pinkdark text-left group">
                    <div class="icon-container w-10 h-10 rounded-full bg-pink-100 text-pink-500 flex items-center justify-center mr-3 transition-colors duration-200 group-hover:bg-white group-hover:text-pink-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-slate-700 text-sm">Inisiasi Menyusu Dini</div>
                        <div class="text-xs text-slate-500 hidden md:block mt-0.5">Langkah Awal Kehidupan</div>
                    </div>
                </button>

                <!-- Button 4: Kelas Menyusui -->
                <button onclick="loadModule('menyusui', 'https://tirtadsusanto-ops.github.io/AplikasiKelasBelajarMenyusui/')" 
                        id="btn-menyusui"
                        class="nav-btn snap-center flex-shrink-0 w-64 md:w-full flex items-center p-3 mb-0 md:mb-3 rounded-xl md:rounded-l-none md:rounded-r-xl transition-all duration-200 border-l-4 border-transparent hover:bg-kia-pinkdark text-left group">
                    <div class="icon-container w-10 h-10 rounded-full bg-blue-100 text-blue-500 flex items-center justify-center mr-3 transition-colors duration-200 group-hover:bg-white group-hover:text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                    </div>
                    <div>
                        <div class="font-bold text-slate-700 text-sm">Kelas Menyusui</div>
                        <div class="text-xs text-slate-500 hidden md:block mt-0.5">Panduan & Praktik Baik</div>
                    </div>
                </button>
            </div>
            
            <!-- Small footer in sidebar for desktop -->
            <div class="p-4 hidden md:block border-t border-pink-100 bg-white">
                <p class="text-xs text-slate-400 text-center">© 2024 Portal KIA Terpadu</p>
            </div>
        </nav>

        <!-- Main Iframe Content -->
        <main class="flex-1 bg-slate-50 relative">
            <!-- Loading indicator layer (visible briefly while iframe loads) -->
            <div id="loading-indicator" class="absolute inset-0 flex items-center justify-center bg-slate-50 z-0 hidden">
                <div class="flex flex-col items-center">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-500 mb-3"></div>
                    <p class="text-sm font-medium text-slate-500 animate-pulse">Memuat Modul...</p>
                </div>
            </div>
            
            <iframe id="content-frame" 
                    src="https://tirtadsusanto-ops.github.io/AplikasiKelasBelajarIsiDanCaraPenggunaanBukuKIA2024/" 
                    class="w-full h-full border-none z-10 relative bg-white"
                    title="Modul Pembelajaran KIA"
                    allowfullscreen>
            </iframe>
        </main>
    </div>

    <script>
        function loadModule(buttonId, url) {
            // Get elements
            const iframe = document.getElementById('content-frame');
            const loading = document.getElementById('loading-indicator');
            const buttons = document.querySelectorAll('.nav-btn');

            // Remove active class from all buttons
            buttons.forEach(btn => btn.classList.remove('active'));

            // Add active class to clicked button
            document.getElementById('btn-' + buttonId).classList.add('active');

            // Show loading animation briefly
            loading.classList.remove('hidden');
            iframe.classList.add('loading');

            // Change iframe source
            iframe.src = url;

            // Wait for iframe to load before showing it again
            iframe.onload = function() {
                loading.classList.add('hidden');
                iframe.classList.remove('loading');
            };
            
            // Scroll nav into view on mobile (if needed to center the active button)
            if (window.innerWidth < 768) {
                const activeBtn = document.getElementById('btn-' + buttonId);
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    </script>
</body>
</html>
